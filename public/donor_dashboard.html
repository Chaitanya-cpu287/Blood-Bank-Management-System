<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Donor Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#f1f5f9;
padding:35px;
color:#1e293b;
}

/* TOP */

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
flex-wrap:wrap;
gap:20px;
}

.title h1{
font-size:38px;
color:#c62828;
margin-bottom:8px;
}

.title p{
color:#64748b;
}

.home-btn{
background:#111827;
color:white;
padding:14px 22px;
border:none;
border-radius:14px;
cursor:pointer;
font-size:15px;
font-weight:600;
transition:0.3s;
}

.home-btn:hover{
transform:translateY(-4px);
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.stat-card{
background:white;
padding:28px;
border-radius:24px;
box-shadow:0 10px 25px rgba(0,0,0,0.06);
display:flex;
justify-content:space-between;
align-items:center;
transition:0.3s;
}

.stat-card:hover{
transform:translateY(-8px);
}

.stat-card i{
font-size:34px;
color:#c62828;
}

.stat-card h3{
font-size:15px;
color:#64748b;
margin-bottom:8px;
}

.stat-card h2{
font-size:34px;
}

/* SEARCH */

.search-box{
background:white;
padding:22px;
border-radius:24px;
box-shadow:0 10px 25px rgba(0,0,0,0.06);
margin-bottom:30px;
display:flex;
gap:15px;
flex-wrap:wrap;
align-items:center;
}

.search-input{
flex:1;
min-width:250px;
position:relative;
}

.search-input i{
position:absolute;
left:18px;
top:50%;
transform:translateY(-50%);
color:#94a3b8;
}

.search-input input{
width:100%;
padding:15px 18px 15px 50px;
border:1px solid #dbeafe;
border-radius:14px;
font-size:15px;
outline:none;
transition:0.3s;
}

.search-input input:focus{
border-color:#c62828;
}

.search-btn{
padding:15px 24px;
border:none;
border-radius:14px;
background:#c62828;
color:white;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

.search-btn:hover{
background:#b71c1c;
transform:translateY(-3px);
}

/* TABLE */

.table-container{
background:white;
border-radius:24px;
box-shadow:0 10px 25px rgba(0,0,0,0.06);
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:900px;
}

thead{
background:#c62828;
color:white;
}

th{
padding:18px;
text-align:left;
font-size:15px;
font-weight:600;
}

td{
padding:18px;
border-bottom:1px solid #f1f5f9;
font-size:15px;
}

tbody tr{
transition:0.2s;
}

tbody tr:hover{
background:#f8fafc;
}

/* BADGES */

.badge{
padding:8px 14px;
border-radius:999px;
font-size:13px;
font-weight:600;
display:inline-block;
}

.group{
background:#ffebee;
color:#c62828;
}

.active{
background:#dcfce7;
color:#15803d;
}

/* RESPONSIVE */

@media(max-width:768px){

body{
padding:20px;
}

.title h1{
font-size:28px;
}

.search-box{
flex-direction:column;
align-items:stretch;
}

.search-btn{
width:100%;
}

}

</style>
</head>

<body>

<!-- TOP -->

<div class="top">

<div class="title">
<h1>Donor Dashboard</h1>
<p>Manage and monitor blood donor records.</p>
</div>

<button class="home-btn"
onclick="window.location.href='analytics.html'">
<i class="fa-solid fa-arrow-left"></i>
Back Dashboard
</button>

</div>

<!-- STATS -->

<div class="stats">

<div class="stat-card">
<div>
<h3>Total Donors</h3>
<h2 id="totalDonors">0</h2>
</div>
<i class="fa-solid fa-users"></i>
</div>

<div class="stat-card">
<div>
<h3>Available Donors</h3>
<h2 id="availableDonors">0</h2>
</div>
<i class="fa-solid fa-user-check"></i>
</div>

<div class="stat-card">
<div>
<h3>Blood Groups</h3>
<h2>8</h2>
</div>
<i class="fa-solid fa-droplet"></i>
</div>

</div>

<!-- SEARCH -->

<div class="search-box">

<div class="search-input">
<i class="fa-solid fa-magnifying-glass"></i>

<input type="text"
id="searchName"
placeholder="Search donor by name...">
</div>

<button class="search-btn"
onclick="searchDonor()">
Search Donor
</button>

</div>

<!-- TABLE -->

<div class="table-container">

<table>

<thead>
<tr>
<th>ID</th>
<th>Donor Name</th>
<th>Phone</th>
<th>Age</th>
<th>Blood Group</th>
<th>Last Donation</th>
<th>Status</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

</div>

<script>

async function loadDonors(){

const res =
await fetch("http://localhost:3000/api/donor-dashboard");

const data = await res.json();

showRows(data.list);

document.getElementById("totalDonors").innerText =
data.list.length;

document.getElementById("availableDonors").innerText =
data.list.length;

}

function showRows(list){

let rows = "";

list.forEach(item=>{

rows += `
<tr>

<td>#${item.donor_id}</td>

<td>
<strong>${item.donor_name}</strong>
</td>

<td>${item.phone}</td>

<td>${item.age}</td>

<td>
<span class="badge group">
${item.group_name}
</span>
</td>

<td>${item.last_donation_date}</td>

<td>
<span class="badge active">
Active
</span>
</td>

</tr>
`;

});

document.getElementById("tbody").innerHTML = rows;

}

async function searchDonor(){

const name =
document.getElementById("searchName").value;

if(name===""){
loadDonors();
return;
}

const res =
await fetch(
"http://localhost:3000/api/search-donor/" + name
);

const data = await res.json();

let rows = "";

data.forEach(item=>{

rows += `
<tr>

<td>#</td>

<td>
<strong>${item.donor_name}</strong>
</td>

<td>${item.phone}</td>

<td>${item.age}</td>

<td>
<span class="badge group">
Unknown
</span>
</td>

<td>-</td>

<td>
<span class="badge active">
Matched
</span>
</td>

</tr>
`;

});

document.getElementById("tbody").innerHTML = rows;

}

loadDonors();

</script>

</body>
</html>
