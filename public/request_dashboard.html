<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Request Dashboard</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
background:#f1f5f9;
padding:35px;
color:#1e293b;
}

/* TOP */

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:30px;
flex-wrap:wrap;
gap:20px;
}

.title h1{
font-size:38px;
color:#1565c0;
margin-bottom:8px;
}

.title p{
color:#64748b;
}

.back-btn{
background:#111827;
color:white;
padding:14px 22px;
border:none;
border-radius:14px;
cursor:pointer;
font-size:15px;
font-weight:600;
transition:0.3s;
}

.back-btn:hover{
transform:translateY(-4px);
}

/* CARDS */

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:30px;
}

.card{
background:white;
padding:28px;
border-radius:24px;
box-shadow:0 10px 25px rgba(0,0,0,0.06);
transition:0.3s;
display:flex;
justify-content:space-between;
align-items:center;
}

.card:hover{
transform:translateY(-8px);
}

.card i{
font-size:34px;
}

.blue i{
color:#1565c0;
}

.red i{
color:#e53935;
}

.green i{
color:#43a047;
}

.card h3{
font-size:15px;
color:#64748b;
margin-bottom:8px;
}

.card h2{
font-size:34px;
}

/* TABLE */

.table-box{
background:white;
border-radius:24px;
box-shadow:0 10px 25px rgba(0,0,0,0.06);
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
min-width:1000px;
}

thead{
background:#1565c0;
color:white;
}

th{
padding:18px;
text-align:left;
font-size:15px;
font-weight:600;
}

td{
padding:18px;
border-bottom:1px solid #f1f5f9;
font-size:15px;
}

tbody tr{
transition:0.2s;
}

tbody tr:hover{
background:#f8fafc;
}

/* BADGES */

.badge{
padding:8px 14px;
border-radius:999px;
font-size:13px;
font-weight:600;
display:inline-block;
}

.emergency{
background:#ffebee;
color:#d32f2f;
}

.normal{
background:#e3f2fd;
color:#1565c0;
}

.low{
background:#fff3e0;
color:#ef6c00;
}

.pending{
background:#fff8e1;
color:#f57f17;
}

.completed{
background:#e8f5e9;
color:#2e7d32;
}

/* RESPONSIVE */

@media(max-width:768px){

body{
padding:20px;
}

.title h1{
font-size:28px;
}

}

</style>
</head>

<body>

<!-- TOP -->

<div class="top">

<div class="title">
<h1>Request Dashboard</h1>
<p>Track and monitor blood requests in real-time.</p>
</div>

<button class="back-btn"
onclick="window.location.href='analytics.html'">

<i class="fa-solid fa-arrow-left"></i>
Back Dashboard

</button>

</div>

<!-- STATS -->

<div class="cards">

<div class="card blue">

<div>
<h3>Total Requests</h3>
<h2 id="r1">0</h2>
</div>

<i class="fa-solid fa-file-medical"></i>

</div>

<div class="card red">

<div>
<h3>Emergency Requests</h3>
<h2 id="r2">0</h2>
</div>

<i class="fa-solid fa-triangle-exclamation"></i>

</div>

<div class="card green">

<div>
<h3>Total Units Required</h3>
<h2 id="r3">0</h2>
</div>

<i class="fa-solid fa-droplet"></i>

</div>

</div>

<!-- TABLE -->

<div class="table-box">

<table>

<thead>

<tr>
<th>Request ID</th>
<th>Patient</th>
<th>Hospital</th>
<th>Blood Group</th>
<th>Units</th>
<th>Priority</th>
<th>Status</th>
</tr>

</thead>

<tbody id="tbody"></tbody>

</table>

</div>

<script>

async function loadRequests(){

const res =
await fetch("http://localhost:3000/api/request-dashboard");

const data = await res.json();

document.getElementById("r1").innerText =
data.total_requests;

document.getElementById("r2").innerText =
data.emergency_requests;

document.getElementById("r3").innerText =
data.total_units_required;

let rows = "";

data.list.forEach(item=>{

rows += `
<tr>

<td>
<strong>#${item.request_id}</strong>
</td>

<td>${item.patient_name}</td>

<td>${item.hospital_name}</td>

<td>
<span class="badge normal">
${item.group_name}
</span>
</td>

<td>${item.units_needed}</td>

<td>
<span class="badge ${item.priority.toLowerCase()}">
${item.priority}
</span>
</td>

<td>
<span class="badge ${item.status.toLowerCase()}">
${item.status}
</span>
</td>

</tr>
`;

});

document.getElementById("tbody").innerHTML = rows;

}

loadRequests();

</script>

</body>
</html>
