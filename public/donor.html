<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Donor Registration</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Poppins',sans-serif;
min-height:100vh;
background:
linear-gradient(135deg,#ffebee,#f1f5f9);
display:flex;
justify-content:center;
align-items:center;
padding:40px 20px;
}

/* CONTAINER */

.container{
width:100%;
max-width:850px;
background:rgba(255,255,255,0.7);
backdrop-filter:blur(18px);
padding:40px;
border-radius:32px;
box-shadow:0 10px 40px rgba(0,0,0,0.08);
}

/* TOP */

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:35px;
flex-wrap:wrap;
gap:20px;
}

.title h1{
font-size:38px;
color:#c62828;
margin-bottom:10px;
}

.title p{
color:#64748b;
line-height:1.7;
}

.home-btn{
padding:14px 22px;
border:none;
border-radius:14px;
background:#111827;
color:white;
font-weight:600;
cursor:pointer;
transition:0.3s;
}

.home-btn:hover{
transform:translateY(-4px);
}

/* FORM */

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:22px;
}

.input-box{
display:flex;
flex-direction:column;
gap:10px;
}

.input-box label{
font-size:14px;
font-weight:600;
color:#334155;
}

.input-box input,
.input-box select{
padding:16px;
border:1px solid #e2e8f0;
border-radius:16px;
font-size:15px;
outline:none;
transition:0.3s;
background:white;
}

.input-box input:focus,
.input-box select:focus{
border-color:#c62828;
box-shadow:0 0 0 4px rgba(198,40,40,0.1);
}

.full{
grid-column:1/3;
}

/* BUTTON */

.submit-btn{
margin-top:30px;
width:100%;
padding:18px;
border:none;
border-radius:18px;
background:linear-gradient(135deg,#c62828,#b71c1c);
color:white;
font-size:17px;
font-weight:600;
cursor:pointer;
transition:0.3s;
display:flex;
justify-content:center;
align-items:center;
gap:12px;
box-shadow:0 10px 25px rgba(198,40,40,0.3);
}

.submit-btn:hover{
transform:translateY(-5px);
}

/* INFO CARD */

.info{
margin-top:25px;
padding:20px;
border-radius:18px;
background:#fff5f5;
display:flex;
gap:15px;
align-items:flex-start;
}

.info i{
font-size:28px;
color:#c62828;
margin-top:2px;
}

.info p{
color:#64748b;
line-height:1.7;
}

/* RESPONSIVE */

@media(max-width:768px){

.container{
padding:30px 20px;
}

.form-grid{
grid-template-columns:1fr;
}

.full{
grid-column:auto;
}

.title h1{
font-size:30px;
}

}

</style>
</head>

<body>

<div class="container">

<!-- TOP -->

<div class="top">

<div class="title">
<h1>Blood Donor Registration</h1>

<p>
Register donors securely and maintain
accurate blood inventory records.
</p>

</div>

<button class="home-btn"
onclick="window.location.href='index.html'">

<i class="fa-solid fa-house"></i>
Home

</button>

</div>

<!-- FORM -->

<form id="donorForm">

<div class="form-grid">

<div class="input-box">
<label>Full Name</label>

<input type="text"
id="name"
placeholder="Enter donor full name"
required>
</div>

<div class="input-box">
<label>Age</label>

<input type="number"
id="age"
placeholder="Enter age"
min="18"
required>
</div>

<div class="input-box">
<label>Gender</label>

<select id="gender">

<option value="Male">Male</option>
<option value="Female">Female</option>
<option value="Other">Other</option>

</select>
</div>

<div class="input-box">
<label>Phone Number</label>

<input type="text"
id="phone"
placeholder="Enter phone number"
required>
</div>

<div class="input-box full">
<label>Address</label>

<input type="text"
id="address"
placeholder="Enter complete address"
required>
</div>

<div class="input-box">
<label>Blood Group</label>

<select id="bg_id" required>

<option value="">Select Blood Group</option>
<option value="1">A+</option>
<option value="2">A-</option>
<option value="3">B+</option>
<option value="4">B-</option>
<option value="5">AB+</option>
<option value="6">AB-</option>
<option value="7">O+</option>
<option value="8">O-</option>

</select>

</div>

<div class="input-box">
<label>Units Donated</label>

<input type="number"
id="units"
placeholder="Enter donated units"
min="1"
required>

</div>

</div>

<button type="submit" class="submit-btn">

<i class="fa-solid fa-droplet"></i>
Register Donor

</button>

</form>

<!-- INFO -->

<div class="info">

<i class="fa-solid fa-circle-info"></i>

<p>
Donors must be above 18 years old and medically fit
before blood donation. Ensure accurate details are entered.
</p>

</div>

</div>

<script>

document.getElementById("donorForm").onsubmit =
async function(e){

e.preventDefault();

const data = {

name:
document.getElementById("name").value,

age:
document.getElementById("age").value,

gender:
document.getElementById("gender").value,

phone:
document.getElementById("phone").value,

address:
document.getElementById("address").value,

bg_id:
document.getElementById("bg_id").value

};

const res =
await fetch("http://localhost:3000/api/donors",{

method:"POST",

headers:{
'Content-Type':'application/json'
},

body:JSON.stringify(data)

});

const result = await res.json();

alert(result.message);

document.getElementById("donorForm").reset();

}

</script>

</body>
</html>
